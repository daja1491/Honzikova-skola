<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#173b73"><title>Shoda podmětu s přísudkem – 30 vět | Honzíkova škola</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#193555;background:#f2f6fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#173b73,#3978d8);color:#fff;padding:24px 16px;text-align:center}h1{font-size:clamp(24px,5vw,36px);margin:12px 0 8px}header p{margin:0;opacity:.93}main{max-width:760px;margin:24px auto;padding:0 16px}.card{background:#fff;padding:clamp(20px,4vw,34px);border-radius:20px;box-shadow:0 5px 22px #1a3d681a}button,a.link{font:inherit;cursor:pointer;border:none;border-radius:13px;padding:13px 18px;min-height:48px;background:#225cc4;color:white;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button.secondary,a.link{background:#e9f0fb;color:#173b73}button:focus-visible,a:focus-visible{outline:3px solid #ffa71c;outline-offset:3px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#506782}.progress{height:12px;background:#e4edfa;border-radius:10px;margin:22px 0;overflow:hidden}.progress>div{height:100%;width:0;background:#24a270;transition:width .2s}.question{font-size:clamp(24px,4.5vw,32px);font-weight:750;line-height:1.5;margin:28px 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choices button{min-height:78px;font-size:30px;background:#e9f0ff;color:#174d9a;border:2px solid #d1e0fb}.choices button.correct{background:#d9f6e3;color:#166338;border-color:#249456}.choices button.wrong{background:#ffdfdf;color:#a52525;border-color:#c44}.choices button:disabled{opacity:1;cursor:default}.feedback{margin:18px 0;padding:16px;background:#f1f6ff;border-radius:12px;line-height:1.5}.hidden{display:none!important}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.score{font-size:30px;font-weight:800}.review{margin:18px 0;padding-left:22px;line-height:1.7}footer{text-align:center;color:#72849a;font-size:13px;margin:24px} @media(max-width:460px){.choices{gap:7px}.choices button{min-height:72px}}
</style></head><body><header><h1>🎒 Honzíkova škola</h1><p>Český jazyk • Shoda podmětu s přísudkem • 30 vět</p></header><main><section class="card" id="game"><div class="toolbar"><a class="link" href="index.html">← Hlavní menu</a><strong id="counter">1 / 30</strong></div><div class="progress"><div id="bar"></div></div><p class="muted">Doplň do věty správnou koncovku: <b>-i, -y, nebo -a</b>.</p><div class="question" id="question"></div><div class="choices" id="choices"></div><div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div><div class="actions"><button id="next" class="hidden">Další věta →</button></div></section><section class="card hidden" id="finish"><h2>🏆 Hotovo!</h2><p class="score" id="score"></p><p id="message"></p><div id="reviewbox" class="hidden"><h3>Věty k procvičení</h3><ol class="review" id="review"></ol></div><div class="actions"><button id="retry">Zopakovat všech 30 vět</button><button class="secondary hidden" id="mistakes">Procvičit jen chyby</button><a class="link" href="index.html">← Hlavní menu</a></div></section><footer>Honzíkova škola • Cvičení 2</footer><script>
const ALL=[{"q": "Hasiči rychle přijel___ k požáru.", "a": "i", "why": "Hasiči – rod mužský životný."}, {"q": "Lavičky stál___ pod starými stromy.", "a": "y", "why": "Lavičky – rod ženský."}, {"q": "Telata odpočíval___ ve stáji.", "a": "a", "why": "Telata – rod střední."}, {"q": "Naši sousedé zasadil___ nový strom.", "a": "i", "why": "Sousedé – rod mužský životný."}, {"q": "Vlaštovky přiletěl___ z teplých krajin.", "a": "y", "why": "Vlaštovky – rod ženský."}, {"q": "Jablka popadal___ do trávy.", "a": "a", "why": "Jablka – rod střední."}, {"q": "Rybáři vytáhl___ z vody velkou rybu.", "a": "i", "why": "Rybáři – rod mužský životný."}, {"q": "Talíře ležel___ na stole.", "a": "y", "why": "Talíře – rod mužský neživotný."}, {"q": "Kůzlata skákal___ kolem ohrady.", "a": "a", "why": "Kůzlata – rod střední."}, {"q": "Učitelky připravil___ zajímavou soutěž.", "a": "y", "why": "Učitelky – rod ženský."}, {"q": "Motýli poletoval___ nad loukou.", "a": "i", "why": "Motýli – rod mužský životný."}, {"q": "Okna se při bouřce otřásal___.", "a": "a", "why": "Okna – rod střední."}, {"q": "Kamarádi čekal___ před školou.", "a": "i", "why": "Kamarádi – rod mužský životný."}, {"q": "Květiny krásně voněl___.", "a": "y", "why": "Květiny – rod ženský."}, {"q": "Mláďata se schoval___ do trávy.", "a": "a", "why": "Mláďata – rod střední."}, {"q": "Autobusy přijel___ na zastávku včas.", "a": "y", "why": "Autobusy – rod mužský neživotný."}, {"q": "Sokolové kroužil___ vysoko nad lesem.", "a": "i", "why": "Sokolové – rod mužský životný."}, {"q": "Hvězdy se rozzářil___ na obloze.", "a": "y", "why": "Hvězdy – rod ženský."}, {"q": "Prasátka usnul___ ve chlévě.", "a": "a", "why": "Prasátka – rod střední."}, {"q": "Zahradníci ostříhal___ živý plot.", "a": "i", "why": "Zahradníci – rod mužský životný."}, {"q": "Vlaky zastavil___ na nádraží.", "a": "y", "why": "Vlaky – rod mužský neživotný."}, {"q": "Zrcadla se rozbil___ při stěhování.", "a": "a", "why": "Zrcadla – rod střední."}, {"q": "Babičky vyprávěl___ dětem pohádky.", "a": "y", "why": "Babičky – rod ženský."}, {"q": "Sportovci vyhrál___ důležitý závod.", "a": "i", "why": "Sportovci – rod mužský životný."}, {"q": "Děti si postavil___ sněhuláka.", "a": "y", "why": "Děti – zvláštní tvar, píšeme -y."}, {"q": "Kola se pomalu otáčel___.", "a": "a", "why": "Kola – rod střední."}, {"q": "Tátové připravil___ dětem překvapení.", "a": "i", "why": "Tátové – rod mužský životný."}, {"q": "Knihy ležel___ v polici.", "a": "y", "why": "Knihy – rod ženský."}, {"q": "Štěňata radostně vrtěl___ ocásky.", "a": "a", "why": "Štěňata – rod střední."}, {"q": "Lékaři pomáhal___ nemocným pacientům.", "a": "i", "why": "Lékaři – rod mužský životný."}];let current=ALL.slice(),position=0,correct=0,misses=[],done=false;const el=id=>document.getElementById(id);
function render(){done=false;let item=current[position];el('counter').textContent=(position+1)+' / '+current.length;el('bar').style.width=(position/current.length*100)+'%';el('question').textContent=item.q;el('feedback').classList.add('hidden');el('next').classList.add('hidden');el('choices').replaceChildren();for(const letter of ['i','y','a']){let b=document.createElement('button');b.textContent=letter;b.addEventListener('click',()=>choose(letter));el('choices').append(b)}}
function choose(letter){if(done)return;done=true;const item=current[position],isRight=letter===item.a;if(isRight)correct++;else misses.push(item);for(const b of el('choices').children){b.disabled=true;if(b.textContent===item.a)b.classList.add('correct');else if(b.textContent===letter)b.classList.add('wrong')}el('feedback').textContent=(isRight?'✅ Správně! ':'❌ Správně je „'+item.a+'“. ')+item.why;el('feedback').classList.remove('hidden');el('bar').style.width=((position+1)/current.length*100)+'%';el('next').textContent=position===current.length-1?'Zobrazit výsledek':'Další věta →';el('next').classList.remove('hidden')}
function finish(){el('game').classList.add('hidden');el('finish').classList.remove('hidden');el('score').textContent=correct+' / '+current.length+' správně ('+Math.round(correct/current.length*100)+' %)';el('message').textContent=misses.length?'Výborná práce! Chybné věty si můžeš znovu procvičit.':'Skvělé! Všechny věty máš správně.';el('mistakes').classList.toggle('hidden',!misses.length);el('reviewbox').classList.toggle('hidden',!misses.length);el('review').replaceChildren();for(const item of misses){const li=document.createElement('li');li.textContent=item.q.replace('___',item.a)+' — '+item.why;el('review').append(li)}}
function start(items){current=items.slice();position=0;correct=0;misses=[];el('finish').classList.add('hidden');el('game').classList.remove('hidden');render();window.scrollTo(0,0)}
el('next').addEventListener('click',()=>{if(position+1<current.length){position++;render()}else finish()});el('retry').addEventListener('click',()=>start(ALL));el('mistakes').addEventListener('click',()=>start(misses));render();
</script></main></body></html>
